    <!-- Auto-fix v2: mata el SW viejo que interceptaba Supabase (se ejecuta UNA vez por usuario) -->
    <script>
      (function() {
        var KEY = 'sw_supabase_fix_v2';
        if (!localStorage.getItem(KEY) && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            localStorage.setItem(KEY, '1');
            if (!regs.length) return; // sin SW — nada que hacer
            Promise.all(regs.map(function(r) { return r.unregister(); }))
              .then(function() { return 'caches' in window ? caches.keys() : Promise.resolve([]); })
              .then(function(keys) { return Promise.all(keys.map(function(k) { return caches.delete(k); })); })
              .then(function() { location.reload(); });
          }).catch(function() { localStorage.setItem(KEY, '1'); });
        }
      })();
    </script>

    <!-- Cache reset manual: visitar /?reset=1 para limpiar SW y caché (útil en Safari) -->
    <script>
      if (location.search.includes('reset=1')) {
        (async () => {
          try {
            const regs = await navigator.serviceWorker?.getRegistrations() || [];
            await Promise.all(regs.map(r => r.unregister()));
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          } catch(e) {}
          location.replace('/');
        })();
      }
    </script>
